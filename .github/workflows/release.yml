name: Release

# Pushes the image to GHCR on every push to the default branch (tags: edge, sha-<short>) and on
# version tags v1.2.3 (tags: 1.2.3, 1.2, 1, latest). Version tags also publish binaries.
# Two variants per push: the light default, and "-full" (every optional build tag, e.g. edge-full).
on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build and push ghcr.io image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: light     # default build, smallest image
            tags: ""
            suffix: ""
          - variant: full      # all optional build tags (docs/CONFIG.md "Build tags")
            tags: alertsfull
            suffix: -full
    permissions:
      contents: read
      packages: write        # push to ghcr.io with GITHUB_TOKEN
      id-token: write        # signed build provenance
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/polyrail
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # git describe for the version string
      - id: version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=${{ github.event.repository.default_branch }}
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            TAGS=${{ matrix.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: mode=max
          sbom: true
      # GitHub attestations are not available to private repositories on a personal account.
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  binaries:
    name: Release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub release
    env:
      GOFLAGS: -mod=mod
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          make dist VERSION="${GITHUB_REF_NAME}"
          cd bin && sha256sum polyrail-* mockprovider-* > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/polyrail-* bin/mockprovider-* bin/SHA256SUMS --generate-notes --verify-tag
