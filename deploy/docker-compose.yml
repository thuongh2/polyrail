# Small mode: one container, embedded Pebble store. Fits a 1 vCPU / 2 GB VPS.
#   cp deploy/.env.example deploy/.env  # then edit it
#   docker compose -f deploy/docker-compose.yml up -d
services:
  polyrail:
    build: ..
    image: polyrail:latest
    restart: unless-stopped
    env_file: .env
    ports: ["8080:8080"]
    volumes: ["gateway-data:/data"] # pre-rename volume name kept so existing data stays attached (D24)
    mem_limit: 512m
volumes:
  gateway-data:
